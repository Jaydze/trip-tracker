<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Trip Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <p class="gate-kicker">Private trip ledger</p>
      <h1>Trip Expense Tracker</h1>
      <p id="gateMsg">Sign in with Google. Only people you invite can see the balances.</p>
      <button class="btn" id="googleBtn" type="button">Continue with Google</button>
      <p class="hint" id="gateHint"></p>
    </div>
  </div>

  <div class="app hidden" id="appRoot">
    <header class="header">
      <div class="header-row">
        <div class="header-main">
          <h1 class="trip-name" id="tripName">—</h1>
          <p class="trip-sub" id="tripSub"></p>
        </div>
        <button class="icon-btn" id="starBtn" title="Star as default" type="button">☆</button>
        <button class="icon-btn" id="newTripBtn" title="New trip" type="button">+</button>
      </div>
      <div class="picker-wrap">
        <select class="picker" id="tripPicker" aria-label="Choose trip"></select>
      </div>
    </header>

    <main class="main" id="main"></main>

    <button class="fab" id="fab" type="button" title="Add transaction">+</button>

    <nav class="tabs">
      <button class="tab on" data-tab="balances" type="button">Balances</button>
      <button class="tab" data-tab="transactions" type="button">Transactions</button>
      <button class="tab" data-tab="setup" type="button">Setup</button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet">
    <div class="sheet" id="sheetBody"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://hyper-glyph-brp54sz.shipstatic.com/app.js"></script>
  <script src="https://hyper-glyph-brp54sz.shipstatic.com/styles.css"></script>
</body>
</html>
