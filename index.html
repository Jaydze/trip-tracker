<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Trip Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Sora:wght@400;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://orbital-flare-44wh97e.shipstatic.com/styles.css" />
</head>
<body>
  <div class="gate" id="gate">
    <div class="gate-card">
      <p class="gate-kicker">Private trip ledger</p>
      <h1>Trip Expense Tracker</h1>
      <p id="gateMsg">Sign in with Google. Only people you invite can see the balances.</p>
      <button class="btn" id="googleBtn" type="button">Continue with Google</button>
      <p class="hint" id="gateHint"></p>
    </div>
  </div>

  <div class="app hidden" id="appRoot">
    <header class="header">
      <div class="header-row">
        <div class="header-main">
          <h1 class="trip-name" id="tripName">—</h1>
          <p class="trip-sub" id="tripSub"></p>
        </div>
        <button class="icon-btn" id="starBtn" title="Star as default" type="button">☆</button>
        <button class="icon-btn" id="newTripBtn" title="New trip" type="button">+</button>
      </div>
      <div class="picker-wrap">
        <select class="picker" id="tripPicker" aria-label="Choose trip"></select>
      </div>
    </header>

    <main class="main" id="main"></main>

    <button class="fab" id="fab" type="button" title="Add transaction">+</button>

    <nav class="tabs">
      <button class="tab on" data-tab="balances" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 19V5M10 19V9M16 19V13M22 19V7"/></svg>
        Balances
      </button>
      <button class="tab" data-tab="transactions" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Transactions
      </button>
      <button class="tab" data-tab="setup" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Setup
      </button>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheet">
    <div class="sheet" id="sheetBody"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://orbital-flare-44wh97e.shipstatic.com/app.js"></script>
</body>
</html>
